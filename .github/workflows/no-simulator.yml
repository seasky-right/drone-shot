name: no-simulator

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/verify_dependency_lock.py
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s simulator_contract/tests -v
