[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-external-sample"
version = "0.1.0"
description = "Out-of-tree v0.2 plugin conformance sample"
requires-python = ">=3.13,<3.14"
dependencies = ["drone-platform==0.1.0"]

[project.entry-points."drone.plugins.v02"]
"sample.external" = "drone_ext_sample:register"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["drone_ext_sample"]

[tool.setuptools.package-data]
drone_ext_sample = ["drone_plugin.json"]
