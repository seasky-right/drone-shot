[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-spatial-world-sample"
version = "0.1.0"
description = "Independent feasible spatial world and Mock backend for v0.2"
requires-python = ">=3.13,<3.14"
dependencies = ["drone-platform==0.1.0"]

[project.entry-points."drone.plugins.v02"]
"sample.spatial-world" = "drone_spatial_world:register"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["drone_spatial_world"]

[tool.setuptools.package-data]
drone_spatial_world = ["drone_plugin.json", "world.json"]
