[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-agent-direct-point"
version = "0.1.0"
description = "DirectPointAgent v0.2 candidate plugin for drone platform"
requires-python = ">=3.13"
dependencies = ["drone-platform==0.1.0"]

[project.entry-points."drone.plugins.v02"]
"drone.agent.direct" = "drone_direct_agent:create_agent"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["drone_direct_agent"]

[tool.setuptools.package-data]
drone_direct_agent = ["drone_plugin.json"]
