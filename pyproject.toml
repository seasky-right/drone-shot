[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "core_build_backend"
backend-path = ["."]

[project]
name = "drone-platform"
version = "0.1.0"
description = "Simulator-independent contracts and no-simulator development tools for drone tasks"
readme = "README.md"
# P0 was validated with CPython 3.13.5.  Broader interpreter support needs
# its own clean-environment evidence before this bound is relaxed.
requires-python = ">=3.13,<3.14"
dependencies = ["packaging>=24,<27", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = []
legacy-airsim = ["msgpack==1.1.1"]

[project.scripts]
drone-run = "core.cli:main"
drone-experiment = "core.experiment_cli:main"
drone-replay = "core.replay:main"
drone-console = "core.console:main"
drone-plugins = "core.plugin_cli:main"

[tool.setuptools]
packages = ["contracts", "core"]
